name: Roamigo Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Unit/API, E2E & Docker Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roamigo
          POSTGRES_PASSWORD: roamigo
          POSTGRES_DB: roamigo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U roamigo -d roamigo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://roamigo:roamigo@127.0.0.1:5432/roamigo?schema=public
      TEST_DATABASE_URL: postgresql://roamigo:roamigo@127.0.0.1:5432/roamigo_test?schema=public
      SESSION_SECRET: ci-test-session-secret-32-bytes-minimum-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare PostgreSQL databases & migrations
        env:
          PGPASSWORD: roamigo
        run: |
          psql -h 127.0.0.1 -U roamigo -d roamigo -c "CREATE DATABASE roamigo_test;" || true
          npx prisma generate
          npx prisma migrate deploy
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
          npm run db:seed

      - name: Run ESLint (including max-lines <= 200)
        run: npm run lint

      - name: Run TypeScript strict typecheck
        run: npm run typecheck

      - name: Run Vitest unit & PostgreSQL API integration tests
        run: npm run test

      - name: Build production frontend & server bundles
        run: npm run build

      - name: Install Google Chrome for Playwright E2E
        run: npx playwright install --with-deps chrome

      - name: Run Playwright multi-context Chrome E2E suite
        run: npm run test:e2e

      - name: Verify production Docker image build
        run: docker build -t roamigo:ci .
